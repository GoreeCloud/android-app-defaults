name: Migrated app Platform Contracts

on:
  pull_request:
    paths:
      - 'apps/camera/goreecloud.platform.yaml'
      - 'apps/launcher/goreecloud.platform.yaml'
      - 'apps/keyboard/goreecloud.platform.yaml'
      - 'apps/gallery/goreecloud.platform.yaml'
      - '.github/workflows/migrated-platform-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/camera/goreecloud.platform.yaml'
      - 'apps/launcher/goreecloud.platform.yaml'
      - 'apps/keyboard/goreecloud.platform.yaml'
      - 'apps/gallery/goreecloud.platform.yaml'
      - '.github/workflows/migrated-platform-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrated-platform-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera:
    name: Camera Platform Contract
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@6cb150d512647a0401b4da9e4741d7591693dee0
    with:
      manifest-path: apps/camera/goreecloud.platform.yaml

  launcher:
    name: Launcher Platform Contract
    # Legacy Launcher PRs #218 and #251 both update the Contract 0.4 validator
    # to this reviewed central workflow revision. Preserve that fix at monorepo scope.
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@e49b9afdea094c96a36a0457b1603f2fa8e8fa6b
    with:
      manifest-path: apps/launcher/goreecloud.platform.yaml

  keyboard:
    name: Keyboard Platform Contract
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@32cfe6395f6e4bc4872a99e8d0c666ea0b1ed7b8
    with:
      manifest-path: apps/keyboard/goreecloud.platform.yaml

  gallery:
    name: Gallery Platform Contract
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@e49b9afdea094c96a36a0457b1603f2fa8e8fa6b
    with:
      manifest-path: apps/gallery/goreecloud.platform.yaml
