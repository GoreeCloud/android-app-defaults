name: Mandatory app migration provenance

on:
  pull_request:
    paths:
      - 'apps/camera/**'
      - 'apps/launcher/**'
      - 'apps/keyboard/**'
      - 'apps/gallery/**'
      - 'docs/migrations/2026-09-29-mandatory-app-consolidation.md'
      - '.github/workflows/mandatory-app-migration-integrity.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/camera/**'
      - 'apps/launcher/**'
      - 'apps/keyboard/**'
      - 'apps/gallery/**'
      - 'docs/migrations/2026-09-29-mandatory-app-consolidation.md'
      - '.github/workflows/mandatory-app-migration-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify mandatory repository ownership and provenance
        shell: bash
        run: |
          set -euo pipefail

          migration_record="docs/migrations/2026-09-29-mandatory-app-consolidation.md"
          test -s "$migration_record"

          verify_app() {
            app="$1"
            legacy_repo="$2"
            imported_sha="$3"
            legacy_pr="$4"
            origin="apps/$app/MIGRATION-ORIGIN.md"

            test -s "$origin"
            test -s "apps/$app/PROJECT-SPECIFICATIONS.md"
            test -s "apps/$app/PROJECT-RECORD.md"

            grep -Fq "Source repository: \`$legacy_repo\`" "$origin"
            grep -Fq "Imported Development revision: \`$imported_sha\`" "$origin"
            grep -Fq "Legacy cutover pull request: \`$legacy_repo#$legacy_pr\`" "$origin"
            grep -Fq "Destination: \`apps/$app/\`" "$origin"

            grep -Fq "\`apps/$app/\`" "$migration_record"
            grep -Fq "\`$imported_sha\`" "$migration_record"
          }

          verify_app camera GoreeCloud/camera 209b89ca31cc23899f6c90d7ca12908281f0af0c 19
          verify_app launcher GoreeCloud/launcher 1eb8dd6d8178f6d730b100559e8f8d149501d18c 248
          verify_app keyboard GoreeCloud/keyboard 041b5e0457f2b4d68dc96a416d5abc1f020646d7 97
          verify_app gallery GoreeCloud/gallery 3f7263c6e31a0af0f1a06b99491f608b96cc69ba 103

      - name: Reject competing legacy specification authority
        shell: bash
        run: |
          set -euo pipefail
          for app in camera launcher keyboard gallery; do
            legacy="apps/$app/SPECIFICATIONS.md"
            test -s "$legacy"
            grep -Fq "Compatibility Redirect" "$legacy"
            grep -Fq "[PROJECT-SPECIFICATIONS.md](PROJECT-SPECIFICATIONS.md)" "$legacy"
            grep -Fq "[PROJECT-RECORD.md](PROJECT-RECORD.md)" "$legacy"
          done
