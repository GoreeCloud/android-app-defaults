name: Migrated Android apps CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: migrated-android-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect migrated app changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      camera: ${{ steps.changes.outputs.camera }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Reject retired app source and Gradle modules
        shell: bash
        run: |
          set -euo pipefail
          # Launcher, Since, and Keyboard are independent repositories.
          # Gallery is a separate new-source project, not an in-monorepo import.
          for retired in keyboard gallery launcher since; do
            if [ -n "$(git ls-files -- "apps/${retired}")" ]; then
              echo "::error::Retired apps/${retired}/ source must not return to android-app-defaults."
              exit 1
            fi
          done
          if [ -n "$(git ls-files -- docs/migrations/legacy-source/keyboard)" ]; then
            echo "::error::Retired Keyboard migration source must not return."
            exit 1
          fi
          if grep -Eq ':apps:(keyboard|gallery|launcher|since)["\x27]' settings.gradle.kts; then
            echo "::error file=settings.gradle.kts::Retired application module declaration was restored."
            exit 1
          fi

      - name: Detect affected migrated apps
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$(git diff --name-only "$BASE_SHA...HEAD")"
          else
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              changed_files="$(git diff --name-only HEAD^ HEAD)"
            else
              changed_files="$(git show --pretty='' --name-only HEAD)"
            fi
          fi

          printf '%s\n' "$changed_files"

          run_all=false
          if printf '%s\n' "$changed_files" |
             grep -qxF '.github/workflows/migrated-android-apps-ci.yml'; then
            run_all=true
          fi

          for app in camera; do
            value=false

            if [ "$run_all" = "true" ] ||
               printf '%s\n' "$changed_files" | grep -q "^apps/${app}/"; then
              value=true
            fi

            echo "${app}=${value}" >> "$GITHUB_OUTPUT"
          done

  camera:
    needs: changes
    if: needs.changes.outputs.camera == 'true'
    name: Camera build, unit tests, lint, and source guard
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/camera
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Provision Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_VERSION="15859902"
          TOOLS_SHA256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          TOOLS_ZIP="$RUNNER_TEMP/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          TOOLS_ROOT="$RUNNER_TEMP/android-command-line-tools"
          TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          curl --fail --location --silent --show-error "$TOOLS_URL" --output "$TOOLS_ZIP"
          echo "$TOOLS_SHA256  $TOOLS_ZIP" | sha256sum --check --strict
          rm -rf "$TOOLS_ROOT"
          mkdir -p "$TOOLS_ROOT/latest"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_ROOT/unpacked"
          mv "$TOOLS_ROOT/unpacked/cmdline-tools"/* "$TOOLS_ROOT/latest/"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$TOOLS_ROOT/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$TOOLS_ROOT/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Validate Camera source contract
        run: python3 scripts/check_android_foundation.py
      - name: Test, lint, and build Camera
        run: gradle --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

  required-gate:
    name: Migrated Android apps required gate
    if: always()
    needs:
      - changes
      - camera
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require affected migrated-app validation
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}

          CAMERA_CHANGED: ${{ needs.changes.outputs.camera }}
          CAMERA_RESULT: ${{ needs.camera.result }}


        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection result is $CHANGES_RESULT"
            exit 1
          fi

          require_result() {
            changed="$1"
            result="$2"
            name="$3"

            if [ "$changed" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::$name validation result is $result"
                exit 1
              fi
            else
              case "$result" in
                success|skipped) ;;
                *)
                  echo "::error::$name unexpected result is $result"
                  exit 1
                  ;;
              esac
            fi
          }

          require_result "$CAMERA_CHANGED" "$CAMERA_RESULT" "Camera"
