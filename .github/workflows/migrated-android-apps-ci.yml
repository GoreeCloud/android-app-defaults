name: Migrated Android apps CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: migrated-android-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect migrated app changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      camera: ${{ steps.changes.outputs.camera }}
      launcher: ${{ steps.changes.outputs.launcher }}
      keyboard: ${{ steps.changes.outputs.keyboard }}
      gallery: ${{ steps.changes.outputs.gallery }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Detect affected migrated apps
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$(git diff --name-only "$BASE_SHA...HEAD")"
          else
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              changed_files="$(git diff --name-only HEAD^ HEAD)"
            else
              changed_files="$(git show --pretty='' --name-only HEAD)"
            fi
          fi

          printf '%s\n' "$changed_files"

          run_all=false
          if printf '%s\n' "$changed_files" |
             grep -qxF '.github/workflows/migrated-android-apps-ci.yml'; then
            run_all=true
          fi

          for app in camera launcher keyboard gallery; do
            value=false

            if [ "$run_all" = "true" ] ||
               printf '%s\n' "$changed_files" | grep -q "^apps/${app}/"; then
              value=true
            fi

            echo "${app}=${value}" >> "$GITHUB_OUTPUT"
          done

  camera:
    needs: changes
    if: needs.changes.outputs.camera == 'true'
    name: Camera build, unit tests, lint, and source guard
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/camera
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Provision Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_VERSION="15859902"
          TOOLS_SHA256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          TOOLS_ZIP="$RUNNER_TEMP/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          TOOLS_ROOT="$RUNNER_TEMP/android-command-line-tools"
          TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          curl --fail --location --silent --show-error "$TOOLS_URL" --output "$TOOLS_ZIP"
          echo "$TOOLS_SHA256  $TOOLS_ZIP" | sha256sum --check --strict
          rm -rf "$TOOLS_ROOT"
          mkdir -p "$TOOLS_ROOT/latest"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_ROOT/unpacked"
          mv "$TOOLS_ROOT/unpacked/cmdline-tools"/* "$TOOLS_ROOT/latest/"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$TOOLS_ROOT/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$TOOLS_ROOT/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Validate Camera source contract
        run: python3 scripts/check_android_foundation.py
      - name: Test, lint, and build Camera
        run: gradle --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

  launcher:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    name: Launcher validation, unit tests, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Set Launcher Development artifact identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          test "$VERSION_CODE" -gt 1439
          echo "GOREECLOUD_DEV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "EXPECTED_LAUNCHER_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Validate Launcher privacy, identity, UI, motion, and Room boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_privacy.py
          python3 scripts/check_manifest.py
          python3 scripts/check_identity.py
          python3 scripts/check_glaze_ui.py
          python3 scripts/check_glaze_motion_evaluation.py
          python3 scripts/check_room_cutover.py
      - name: Test, lint, and build Launcher
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Verify Launcher Room schema
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_room_schema.py
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "Room schema history changed during generation and is not committed exactly."
            git status --short -- app/schemas
            exit 1
          fi
      - name: Stage Launcher Development APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          APPLICATION_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          echo "Launcher APK identity: package=$APPLICATION_ID versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          test "$APPLICATION_ID" = "com.goreecloud.launcher.dev"
          test "$VERSION_NAME" = "0.1.0-dev"
          test "$VERSION_CODE" = "$EXPECTED_LAUNCHER_VERSION_CODE"
          "$APKSIGNER" verify --verbose "$APK"
          ARTIFACT_ROOT="artifact-launcher-android"
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT"
          cp "$APK" "$ARTIFACT_ROOT/GoreeCloud-Launcher-Dev.apk"
          cat > "$ARTIFACT_ROOT/BUILD-PROVENANCE.txt" <<EOF
          repository=GoreeCloud/android-app-defaults
          component_path=apps/launcher
          source_sha=$(git rev-parse HEAD)
          application_id=$APPLICATION_ID
          version_name=$VERSION_NAME
          version_code=$VERSION_CODE
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          run_number=$GITHUB_RUN_NUMBER
          run_attempt=$GITHUB_RUN_ATTEMPT
          signing_role=ci-debug-installability-only
          update_in_place_continuity=not-established
          stable_release_authority=none
          EOF
          (
            cd "$ARTIFACT_ROOT"
            sha256sum ./*.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Upload Launcher Development sidecar APK
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-launcher-android-dev-sidecar
          if-no-files-found: error
          retention-days: 14
          path: apps/launcher/artifact-launcher-android/*

  launcher-runtime:
    needs:
      - changes
      - launcher
    if: needs.changes.outputs.launcher == 'true' && needs.launcher.result == 'success'
    name: Launcher Android 16 runtime instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Detect Android emulator acceleration
        id: emulator-accel
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "kvm_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM acceleration is unavailable; Launcher Android 16 instrumentation will use software acceleration."
          fi
      - name: Validate Launcher runtime harness
        shell: bash
        run: bash -n scripts/run_android16_runtime.sh
      - name: Run complete Launcher Android 16 instrumentation suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: ${{ steps.emulator-accel.outputs.kvm_available != 'true' }}
          script: bash "$GITHUB_WORKSPACE/apps/launcher/scripts/run_android16_runtime.sh"
      - name: Upload Launcher Android 16 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-android16-runtime-reports
          path: |
            apps/launcher/ci-runtime/**
            apps/launcher/app/build/reports/androidTests/connected/**
            apps/launcher/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14

  launcher-transition-performance:
    needs:
      - changes
      - launcher
    if: needs.changes.outputs.launcher == 'true' && needs.launcher.result == 'success'
    name: Launcher Android 16 transition performance diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Detect Android emulator acceleration
        id: emulator-accel
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "kvm_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM acceleration is unavailable; Launcher transition diagnostics will use software acceleration."
          fi
      - name: Measure Launcher Home and Apps transition frame timing on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: false
          disable-linux-hw-accel: ${{ steps.emulator-accel.outputs.kvm_available != 'true' }}
          script: |
            adb logcat -c
            gradle --project-dir "$GITHUB_WORKSPACE/apps/launcher" --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.goreecloud.launcher.ui.LauncherTransitionPerformanceRuntimeTest
            mkdir -p "$GITHUB_WORKSPACE/apps/launcher/ci-performance"
            adb logcat -d -s LauncherTransitionPerf:I '*:S' | tee "$GITHUB_WORKSPACE/apps/launcher/ci-performance/transition-performance.log"
      - name: Upload Launcher transition-performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-android16-transition-performance
          path: |
            apps/launcher/ci-performance/**
            apps/launcher/app/build/reports/androidTests/connected/**
            apps/launcher/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14

  keyboard:
    needs: changes
    if: needs.changes.outputs.keyboard == 'true'
    name: Keyboard validation, unit tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/keyboard
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Validate Keyboard boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_glaze_motion_evaluation.py
          python3 scripts/check_editor_privacy_lifecycle.py
          python3 scripts/check_keyboard_accessibility.py
          python3 scripts/check_repository_feature_records.py
      - name: Test and build Keyboard
        run: gradle --no-daemon :android:app:testDebugUnitTest :android:app:assembleDebug --stacktrace

  keyboard-runtime:
    needs:
      - changes
      - keyboard
    if: needs.changes.outputs.keyboard == 'true' && needs.keyboard.result == 'success'
    name: Keyboard Android 15 runtime instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/keyboard
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Detect Android emulator acceleration
        id: emulator-accel
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "kvm_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM acceleration is unavailable; Keyboard Android 15 instrumentation will use software acceleration."
          fi
      - name: Run complete Keyboard Android 15 instrumentation suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: ${{ steps.emulator-accel.outputs.kvm_available != 'true' }}
          script: gradle --project-dir "$GITHUB_WORKSPACE/apps/keyboard" --no-daemon :android:app:connectedDebugAndroidTest --stacktrace
      - name: Upload Keyboard Android 15 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-android15-runtime-reports
          path: |
            apps/keyboard/android/app/build/reports/androidTests/connected/**
            apps/keyboard/android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14

  gallery:
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    name: Gallery native core, adapter, unit tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/gallery/native
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Set Gallery Development artifact identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((2000000 + GITHUB_RUN_NUMBER))
          test "$VERSION_CODE" -gt 2000730
          echo "GOREECLOUD_GALLERY_DEV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "EXPECTED_GALLERY_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Test and lint Gallery native core, adapter, and app
        run: gradle :core:test :android-adapter:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build Gallery native debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Stage Gallery Development APK transport artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          SDK_ROOT="$ANDROID_SDK_ROOT"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          APPLICATION_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          echo "Gallery APK transport identity: package=$APPLICATION_ID versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          test "$APPLICATION_ID" = "com.goreecloud.gallery.dev"
          test "$VERSION_NAME" = "0.8.9-dev"
          test "$VERSION_CODE" = "$EXPECTED_GALLERY_VERSION_CODE"
          "$APKSIGNER" verify --verbose "$APK"
          ARTIFACT_ROOT="artifact-gallery-android"
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT"
          cp "$APK" "$ARTIFACT_ROOT/GoreeCloud-Gallery-Dev-CI-Transport.apk"
          cat > "$ARTIFACT_ROOT/BUILD-PROVENANCE.txt" <<EOF
          repository=GoreeCloud/android-app-defaults
          component_path=apps/gallery/native
          source_sha=$(git rev-parse HEAD)
          application_id=$APPLICATION_ID
          version_name=$VERSION_NAME
          version_code=$VERSION_CODE
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          run_number=$GITHUB_RUN_NUMBER
          run_attempt=$GITHUB_RUN_ATTEMPT
          signing_role=ci-debug-transport-only
          update_in_place_continuity=requires-development-resigning
          stable_release_authority=none
          EOF
          (
            cd "$ARTIFACT_ROOT"
            sha256sum ./*.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Upload Gallery Development APK transport sidecar
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-gallery-android-dev-transport
          if-no-files-found: error
          retention-days: 14
          path: apps/gallery/native/artifact-gallery-android/*
      - name: Stage Android apksigner helper
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APKSIGNER_JAR="$(dirname "$APKSIGNER")/lib/apksigner.jar"
          test -f "$APKSIGNER_JAR"
          rm -rf artifact-gallery-apksigner
          mkdir -p artifact-gallery-apksigner
          cp "$APKSIGNER_JAR" artifact-gallery-apksigner/apksigner.jar
          sha256sum artifact-gallery-apksigner/apksigner.jar > artifact-gallery-apksigner/SHA256SUMS
      - name: Upload Android apksigner helper
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-gallery-apksigner-helper
          if-no-files-found: error
          retention-days: 1
          path: apps/gallery/native/artifact-gallery-apksigner/*

  gallery-runtime:
    needs:
      - changes
      - gallery
    if: needs.changes.outputs.gallery == 'true' && needs.gallery.result == 'success'
    name: Gallery Android 16 runtime instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/gallery/native
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Detect Android emulator acceleration
        id: emulator-accel
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "kvm_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM acceleration is unavailable; Gallery Android 16 instrumentation will use software acceleration."
          fi
      - name: Run complete Gallery Android 16 instrumentation suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: ${{ steps.emulator-accel.outputs.kvm_available != 'true' }}
          script: gradle --project-dir "$GITHUB_WORKSPACE/apps/gallery/native" --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload Gallery Android 16 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android16-runtime-reports
          path: |
            apps/gallery/native/app/build/reports/androidTests/connected/**
            apps/gallery/native/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14

  required-gate:
    name: Migrated Android apps required gate
    if: always()
    needs:
      - changes
      - camera
      - launcher
      - launcher-runtime
      - launcher-transition-performance
      - keyboard
      - keyboard-runtime
      - gallery
      - gallery-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require affected migrated-app validation
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}

          CAMERA_CHANGED: ${{ needs.changes.outputs.camera }}
          CAMERA_RESULT: ${{ needs.camera.result }}

          LAUNCHER_CHANGED: ${{ needs.changes.outputs.launcher }}
          LAUNCHER_RESULT: ${{ needs.launcher.result }}
          LAUNCHER_RUNTIME_RESULT: ${{ needs.launcher-runtime.result }}
          LAUNCHER_PERFORMANCE_RESULT: ${{ needs.launcher-transition-performance.result }}

          KEYBOARD_CHANGED: ${{ needs.changes.outputs.keyboard }}
          KEYBOARD_RESULT: ${{ needs.keyboard.result }}
          KEYBOARD_RUNTIME_RESULT: ${{ needs.keyboard-runtime.result }}

          GALLERY_CHANGED: ${{ needs.changes.outputs.gallery }}
          GALLERY_RESULT: ${{ needs.gallery.result }}
          GALLERY_RUNTIME_RESULT: ${{ needs.gallery-runtime.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection result is $CHANGES_RESULT"
            exit 1
          fi

          require_result() {
            changed="$1"
            result="$2"
            name="$3"

            if [ "$changed" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::$name validation result is $result"
                exit 1
              fi
            else
              case "$result" in
                success|skipped) ;;
                *)
                  echo "::error::$name unexpected result is $result"
                  exit 1
                  ;;
              esac
            fi
          }

          require_result "$CAMERA_CHANGED" "$CAMERA_RESULT" "Camera"
          require_result "$LAUNCHER_CHANGED" "$LAUNCHER_RESULT" "Launcher"
          require_result "$LAUNCHER_CHANGED" "$LAUNCHER_RUNTIME_RESULT" "Launcher Android 16 runtime"
          require_result "$LAUNCHER_CHANGED" "$LAUNCHER_PERFORMANCE_RESULT" "Launcher transition performance"
          require_result "$KEYBOARD_CHANGED" "$KEYBOARD_RESULT" "Keyboard"
          require_result "$KEYBOARD_CHANGED" "$KEYBOARD_RUNTIME_RESULT" "Keyboard Android 15 runtime"
          require_result "$GALLERY_CHANGED" "$GALLERY_RESULT" "Gallery"
          require_result "$GALLERY_CHANGED" "$GALLERY_RUNTIME_RESULT" "Gallery Android 16 runtime"
