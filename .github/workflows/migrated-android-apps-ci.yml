name: Migrated Android apps CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: migrated-android-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect migrated app changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      camera: ${{ steps.changes.outputs.camera }}
      launcher: ${{ steps.changes.outputs.launcher }}
      keyboard: ${{ steps.changes.outputs.keyboard }}
      gallery: ${{ steps.changes.outputs.gallery }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Detect affected migrated apps
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$(git diff --name-only "$BASE_SHA...HEAD")"
          else
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              changed_files="$(git diff --name-only HEAD^ HEAD)"
            else
              changed_files="$(git show --pretty='' --name-only HEAD)"
            fi
          fi

          printf '%s\n' "$changed_files"

          run_all=false
          if printf '%s\n' "$changed_files" |
             grep -qxF '.github/workflows/migrated-android-apps-ci.yml'; then
            run_all=true
          fi

          for app in camera launcher keyboard gallery; do
            value=false

            if [ "$run_all" = "true" ] ||
               printf '%s\n' "$changed_files" | grep -q "^apps/${app}/"; then
              value=true
            fi

            echo "${app}=${value}" >> "$GITHUB_OUTPUT"
          done

  camera:
    needs: changes
    if: needs.changes.outputs.camera == 'true'
    name: Camera build, unit tests, lint, and source guard
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/camera
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Provision Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_VERSION="15859902"
          TOOLS_SHA256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          TOOLS_ZIP="$RUNNER_TEMP/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          TOOLS_ROOT="$RUNNER_TEMP/android-command-line-tools"
          TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          curl --fail --location --silent --show-error "$TOOLS_URL" --output "$TOOLS_ZIP"
          echo "$TOOLS_SHA256  $TOOLS_ZIP" | sha256sum --check --strict
          rm -rf "$TOOLS_ROOT"
          mkdir -p "$TOOLS_ROOT/latest"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_ROOT/unpacked"
          mv "$TOOLS_ROOT/unpacked/cmdline-tools"/* "$TOOLS_ROOT/latest/"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$TOOLS_ROOT/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$TOOLS_ROOT/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Validate Camera source contract
        run: python3 scripts/check_android_foundation.py
      - name: Test, lint, and build Camera
        run: gradle --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

  launcher:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    name: Launcher validation, unit tests, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOREECLOUD_DEV_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Validate Launcher privacy, identity, UI, motion, and Room boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_privacy.py
          python3 scripts/check_manifest.py
          python3 scripts/check_identity.py
          python3 scripts/check_glaze_ui.py
          python3 scripts/check_glaze_motion_evaluation.py
          python3 scripts/check_room_cutover.py
      - name: Test, lint, and build Launcher
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Verify Launcher Room schema
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_room_schema.py
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "Room schema history changed during generation and is not committed exactly."
            git status --short -- app/schemas
            exit 1
          fi

  keyboard:
    needs: changes
    if: needs.changes.outputs.keyboard == 'true'
    name: Keyboard validation, unit tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/keyboard
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Validate Keyboard boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_glaze_motion_evaluation.py
          python3 scripts/check_editor_privacy_lifecycle.py
          python3 scripts/check_keyboard_accessibility.py
          python3 scripts/check_repository_feature_records.py
      - name: Test and build Keyboard
        run: gradle --no-daemon :android:app:testDebugUnitTest :android:app:assembleDebug --stacktrace

  gallery:
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    name: Gallery native core, adapter, unit tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/gallery/native
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Test Gallery native core, adapter, and app
        run: gradle :core:test :android-adapter:testDebugUnitTest :app:testDebugUnitTest --no-daemon
      - name: Build Gallery native debug APK
        run: gradle :app:assembleDebug --no-daemon

  required-gate:
    name: Migrated Android apps required gate
    if: always()
    needs:
      - changes
      - camera
      - launcher
      - keyboard
      - gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require affected migrated-app validation
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}

          CAMERA_CHANGED: ${{ needs.changes.outputs.camera }}
          CAMERA_RESULT: ${{ needs.camera.result }}

          LAUNCHER_CHANGED: ${{ needs.changes.outputs.launcher }}
          LAUNCHER_RESULT: ${{ needs.launcher.result }}

          KEYBOARD_CHANGED: ${{ needs.changes.outputs.keyboard }}
          KEYBOARD_RESULT: ${{ needs.keyboard.result }}

          GALLERY_CHANGED: ${{ needs.changes.outputs.gallery }}
          GALLERY_RESULT: ${{ needs.gallery.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection result is $CHANGES_RESULT"
            exit 1
          fi

          require_result() {
            changed="$1"
            result="$2"
            name="$3"

            if [ "$changed" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::$name validation result is $result"
                exit 1
              fi
            else
              case "$result" in
                success|skipped) ;;
                *)
                  echo "::error::$name unexpected result is $result"
                  exit 1
                  ;;
              esac
            fi
          }

          require_result "$CAMERA_CHANGED" "$CAMERA_RESULT" "Camera"
          require_result "$LAUNCHER_CHANGED" "$LAUNCHER_RESULT" "Launcher"
          require_result "$KEYBOARD_CHANGED" "$KEYBOARD_RESULT" "Keyboard"
          require_result "$GALLERY_CHANGED" "$GALLERY_RESULT" "Gallery"
