name: Android Development Foundation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: android-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  since:
    name: Since build, unit tests, lint, schema, and manifest guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Verify local-only manifest boundary
        run: python3 scripts/check_since_manifest.py

      - name: Test, lint, and assemble Since
        run: gradle --no-daemon :apps:since:testDebugUnitTest :apps:since:lintDebug :apps:since:assembleDebug :apps:since:assembleDebugAndroidTest

      - name: Verify committed Room schema is current
        run: |
          git diff --exit-code -- apps/since/schemas
          test -z "$(git status --porcelain --untracked-files=all -- apps/since/schemas)"

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v4
        with:
          name: since-room-schema
          path: apps/since/schemas
          if-no-files-found: error

      - name: Upload Since runtime APKs
        uses: actions/upload-artifact@v4
        with:
          name: since-runtime-apks
          path: |
            apps/since/build/outputs/apk/debug/*.apk
            apps/since/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  since-runtime:
    name: Since Android 16 Room runtime invariants
    needs: since
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download validated Since APKs
        uses: actions/download-artifact@v4
        with:
          name: since-runtime-apks
          path: ci-apks

      - name: Run Android 16 database tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            set -eu
            APP_APK="$(find ci-apks -type f -name '*-debug.apk' ! -name '*androidTest*' | head -n 1)"
            TEST_APK="$(find ci-apks -type f -name '*-debug-androidTest.apk' | head -n 1)"
            test -n "$APP_APK"
            test -n "$TEST_APK"

            echo "Android /data capacity before install:"
            adb shell df -h /data

            echo "Installing application APK: $APP_APK"
            adb install -r "$APP_APK"

            echo "Installing instrumentation APK: $TEST_APK"
            adb install -r "$TEST_APK"

            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
            test -n "$AAPT"
            TEST_PACKAGE="$("$AAPT" dump badging "$TEST_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            test -n "$TEST_PACKAGE"

            set +e
            OUTPUT="$(adb shell am instrument -w "$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" 2>&1)"
            STATUS=$?
            set -e
            printf '%s\n' "$OUTPUT"
            test "$STATUS" -eq 0
            printf '%s\n' "$OUTPUT" | grep -Eq 'OK \([1-9][0-9]* tests?\)'
