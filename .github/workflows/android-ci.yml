name: Android Development Foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  since:
    name: Since build, unit tests, lint, schema, and manifest guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Verify local-only manifest boundary
        run: python3 scripts/check_since_manifest.py

      - name: Test, lint, and assemble Since
        run: gradle --no-daemon :apps:since:testDebugUnitTest :apps:since:lintDebug :apps:since:assembleDebug

      - name: Verify committed Room schema is current
        run: |
          git diff --exit-code -- apps/since/schemas
          test -z "$(git status --porcelain --untracked-files=all -- apps/since/schemas)"

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v4
        with:
          name: since-room-schema
          path: apps/since/schemas
          if-no-files-found: error

  since-runtime:
    name: Since Android 16 Room runtime invariants
    needs: since
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Run Android 16 database tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon :apps:since:connectedDebugAndroidTest
