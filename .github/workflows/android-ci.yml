name: Android Development Foundation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: android-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clock:
    name: Clock build, unit tests, lint, and manifest guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Verify Clock manifest privacy boundary
        run: python3 scripts/check_clock_manifest.py

      - name: Test, lint, and assemble Clock
        run: gradle --no-daemon :apps:clock:testDebugUnitTest :apps:clock:lintDebug :apps:clock:assembleDebug :apps:clock:assembleDebugAndroidTest

      - name: Upload Clock Development APK
        uses: actions/upload-artifact@v4
        with:
          name: clock-development-apk
          path: apps/clock/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Clock runtime APKs
        uses: actions/upload-artifact@v4
        with:
          name: clock-runtime-apks
          path: |
            apps/clock/build/outputs/apk/debug/*.apk
            apps/clock/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  clock-runtime:
    name: Clock Android 16 runtime instrumentation
    needs: clock
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download validated Clock APKs
        uses: actions/download-artifact@v4
        with:
          name: clock-runtime-apks
          path: ci-clock-apks

      - name: Detect Android emulator acceleration
        id: emulator-accel
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm || true
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm_available=true" >> "$GITHUB_OUTPUT"
            echo "KVM acceleration is available."
          else
            echo "kvm_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM acceleration is unavailable; Android 16 instrumentation will use software acceleration."
          fi

      - name: Run Clock Android 16 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: ${{ steps.emulator-accel.outputs.kvm_available != 'true' }}
          script: bash scripts/run_clock_android_tests.sh

      - name: Upload Clock rendered visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: clock-rendered-ui
          path: ci-clock-screenshots/*.png
          if-no-files-found: error

  required-gate:
    name: Android Development required gate
    if: always()
    needs:
      - clock
      - clock-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Clock Android validation
        shell: bash
        env:
          CLOCK_RESULT: ${{ needs.clock.result }}
          CLOCK_RUNTIME_RESULT: ${{ needs.clock-runtime.result }}
        run: |
          set -euo pipefail
          test "$CLOCK_RESULT" = "success" || { echo "::error::Clock build result is $CLOCK_RESULT"; exit 1; }
          test "$CLOCK_RUNTIME_RESULT" = "success" || { echo "::error::Clock Android 16 result is $CLOCK_RUNTIME_RESULT"; exit 1; }
