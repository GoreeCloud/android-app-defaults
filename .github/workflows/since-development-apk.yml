name: Since Development APK Distribution

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Positive Android versionCode, greater than the previous owner-distribution build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-development-apk:
    name: Build protected Since Development APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: since-development

    steps:
      - name: Check out exact selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Validate requested versionCode
        shell: bash
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo "::error::version_code must be a positive integer"; exit 1 ;;
          esac
          test "$VERSION_CODE" -gt 0 || { echo "::error::version_code must be greater than zero"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Materialize protected Development keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.GOREECLOUD_DEV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::GOREECLOUD_DEV_KEYSTORE_B64 is not configured"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/since-development-keystore.p12"
          test -s "$RUNNER_TEMP/since-development-keystore.p12"
          chmod 600 "$RUNNER_TEMP/since-development-keystore.p12"

      - name: Verify local-only manifest boundary
        run: python3 scripts/check_since_manifest.py

      - name: Test, lint, and build signed Development APK
        env:
          GOREECLOUD_DEV_VERSION_CODE: ${{ inputs.version_code }}
          GOREECLOUD_DEV_KEYSTORE_PATH: ${{ runner.temp }}/since-development-keystore.p12
          GOREECLOUD_DEV_KEYSTORE_PASSWORD: ${{ secrets.GOREECLOUD_DEV_KEYSTORE_PASSWORD }}
          GOREECLOUD_DEV_KEY_ALIAS: ${{ secrets.GOREECLOUD_DEV_KEY_ALIAS }}
          GOREECLOUD_DEV_KEY_PASSWORD: ${{ secrets.GOREECLOUD_DEV_KEY_PASSWORD }}
        run: gradle --no-daemon :apps:since:testDebugUnitTest :apps:since:lintDebug :apps:since:assembleDebug

      - name: Verify signed APK identity and provenance
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          APK="$(find apps/since/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT" && test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING" | grep -F "name='com.goreecloud.since.dev'"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"
          {
            echo "source_sha=${{ github.sha }}"
            echo "version_code=$EXPECTED_VERSION_CODE"
            echo "package=com.goreecloud.since.dev"
            cat "$RUNNER_TEMP/apk-sha256.txt"
            grep -E 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt"
          } > "$RUNNER_TEMP/BUILD-PROVENANCE.txt"

      - name: Stage distribution artifact
        shell: bash
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p distribution
          APK="$(find apps/since/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cp "$APK" "distribution/GoreeCloud-Since-Development-vc${VERSION_CODE}-${GITHUB_SHA::7}.apk"
          cp "$RUNNER_TEMP/BUILD-PROVENANCE.txt" distribution/BUILD-PROVENANCE.txt

      - name: Upload protected Development artifact
        uses: actions/upload-artifact@v4
        with:
          name: since-development-apk-vc${{ inputs.version_code }}
          path: distribution
          if-no-files-found: error
